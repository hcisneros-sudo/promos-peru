name: Actualizar promociones

on:
  schedule:
    # Domingo, 6:20 a. m. en Perú (UTC-5).
    - cron: "20 11 * * 0"
  workflow_dispatch:
    inputs:
      regeocodificar_todo:
        description: "Regeocodificar todas las direcciones desde cero"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: actualizar-promociones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      CLUBHOLA_DNI: ${{ secrets.CLUBHOLA_DNI }}
      REGEOCODIFICAR_TODO: ${{ github.event_name == 'workflow_dispatch' && inputs.regeocodificar_todo && 'true' || 'false' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar Chrome para BanBif
        uses: browser-actions/setup-chrome@v2
      - name: Consultar los seis bancos
        run: python scripts/run_scrapers.py
      - name: Limpiar y unificar promociones
        run: |
          python scripts/actualizar_promociones.py --entrada data/fuentes --salida work/salida
          gzip -dc data/geocoding/locales_geocodificados.json.gz > work/salida/locales_geocodificados.json
      - name: Recuperar coordenadas y consultar direcciones nuevas
        shell: bash
        run: |
          if [[ "$REGEOCODIFICAR_TODO" == "true" && -z "$GEOAPIFY_API_KEY" ]]; then
            echo "No se puede ejecutar la regeocodificación completa sin GEOAPIFY_API_KEY."
            exit 1
          elif [[ "$REGEOCODIFICAR_TODO" == "true" ]]; then
            echo "Regeocodificación completa: se usará una caché nueva y aislada."
            python scripts/geocodificar_locales.py \
              --entrada work/salida/locales.json \
              --salida work/salida/locales_geocodificados.json \
              --revision work/revision_geocodificacion.json \
              --geojson work/salida/locales_mapa.geojson \
              --cache work/geocodificacion_nueva.sqlite \
              --lugares scripts/lugares_conocidos.json \
              --desde-cero
          elif [[ -n "$GEOAPIFY_API_KEY" ]]; then
            python scripts/geocodificar_locales.py \
              --entrada work/salida/locales.json \
              --salida work/salida/locales_geocodificados.json \
              --revision work/revision_geocodificacion.json \
              --geojson work/salida/locales_mapa.geojson \
              --cache data/geocoding/geocodificacion_cache.sqlite \
              --lugares scripts/lugares_conocidos.json
          else
            echo "GEOAPIFY_API_KEY no configurada; se utilizará únicamente el historial."
            python scripts/geocodificar_locales.py \
              --entrada work/salida/locales.json \
              --salida work/salida/locales_geocodificados.json \
              --revision work/revision_geocodificacion.json \
              --geojson work/salida/locales_mapa.geojson \
              --cache data/geocoding/geocodificacion_cache.sqlite \
              --lugares scripts/lugares_conocidos.json \
              --solo-cache
          fi
      - name: Generar base maestra y catálogo web
        run: |
          python scripts/generar_base_maestra.py --entrada work/salida --salida work/final
          python scripts/preparar_catalogo_web.py \
            --entrada work/final/promociones_web.json \
            --salida work/site-data
      - name: Impedir una publicación incompleta o regresiva
        run: |
          python scripts/validar_publicacion.py \
            --candidate work/site-data \
            --current site/data \
            --summary work/final/resumen_maestro.json
      - name: Incorporar el catálogo validado
        shell: bash
        run: |
          rsync -a --delete work/site-data/ site/data/
          cp work/final/resumen_maestro.json reports/resumen_maestro.json
          cp work/revision_geocodificacion.json reports/revision_geocodificacion.json
          gzip -9 -n -c work/salida/locales_geocodificados.json > data/geocoding/locales_geocodificados.json.gz
          if [[ "$REGEOCODIFICAR_TODO" == "true" ]]; then
            cp work/geocodificacion_nueva.sqlite data/geocoding/geocodificacion_cache.sqlite
          fi
      - name: Guardar actualización
        run: |
          git config user.name "promos-peru-bot"
          git config user.email "promos-peru-bot@users.noreply.github.com"
          git add data/fuentes data/geocoding site/data reports
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar promociones $(date -u +%Y-%m-%d)"
            git push
          fi
